name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only. The container job raises its own permission to publish a package.
permissions:
  contents: read

concurrency:
  # A new push supersedes an in-flight run for the same ref.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build, vet and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Single source of truth for the toolchain version.
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            gofmt -d $unformatted
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # -race because the broker fans one upstream connection out to many
      # subscribers under a single lock, and a regression there is a data
      # race long before it is a visible bug. -count=1 defeats the cache so
      # a green run means the tests actually ran.
      - name: test
        run: go test -race -count=1 ./...

  e2e:
    name: browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: install playwright
        working-directory: test/lab
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      # Drives labview in a real browser against a fake lab: a minimal RFB
      # server, unix sockets printing a boot, and a proxy asserting an
      # identity. See test/lab/README.md for why unit tests do not cover this.
      - name: run
        env:
          NODE_PATH: ${{ github.workspace }}/test/lab/node_modules
          SHOTS_DIR: ${{ runner.temp }}/shots
        run: test/lab/run.sh

      # The screenshots are the point when something fails: a layout bug is
      # far quicker to read from an image than from an assertion message.
      - name: upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
          retention-days: 7

  container:
    name: container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To publish the image to the registry of this repository.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # A pull request builds the image and publishes nothing, so a broken
      # Dockerfile fails the check before main gets an image from it.
      - name: log in to the registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/labview
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      # The build stage cross-compiles, so the two architectures need no
      # emulation and no second runner.
      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The ruleset of main names this job, and not the jobs above it. A new job
  # above needs no change in the ruleset.
  gate:
    name: ci passed
    needs: [check, e2e, container]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "error: a job of this workflow did not pass"
              exit 1
            fi
          done
