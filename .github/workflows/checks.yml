name: checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read
  # `pull request rules` reads the type label of the issue and the files of
  # the pull request.
  issues: read
  pull-requests: read

jobs:
  documents:
    name: documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-docs.sh

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-workflows.sh

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-changelog.sh

  pull-request-rules:
    name: pull request rules
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-pull-request.sh "$GITHUB_EVENT_PATH"
        env:
          GH_TOKEN: ${{ github.token }}

  # The ruleset of main names this job, and not the jobs above it. A new job
  # above needs no change in the ruleset, and `workflows` fails if the new job
  # is missing from `needs`.
  gate:
    name: checks passed
    needs: [documents, workflows, changelog, pull-request-rules]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: check the results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "error: a job of this workflow did not pass"
              exit 1
            fi
          done
