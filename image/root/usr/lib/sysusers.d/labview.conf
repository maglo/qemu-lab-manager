# Create the labview account on first boot. polkit matches the user name
# the host sees (docs/design/labview.md section 10).
u labview - "labview console wall" /var/lib/labview /sbin/nologin
# qemu opens the sockets and writes screenshots; labview must share that
# group (deploy/labview.service). The machines directory is group-writable
# so QEMU can create serial and QMP sockets next to the disk.
m labview qemu
