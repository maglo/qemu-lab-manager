# labview behind a reverse proxy (design section 10).
#
# labview binds loopback and does no authentication of its own. This is where
# TLS is terminated and SSO happens, and there are three details that labview
# depends on:
#
#   1. The original Host header is forwarded, so labview's websocket origin
#      check keeps working. It compares Origin against Host, and a proxy that
#      rewrites Host to 127.0.0.1:8080 will make every websocket look
#      cross-origin and be refused.
#
#   2. X-Forwarded-User is set from the authenticated identity, and is set on
#      the websocket upgrade as well as on ordinary requests. A proxy that
#      sets it only on plain HTTP leaves every console and serial socket
#      unidentified, so no lease ever matches the person holding it and
#      nobody can type. This is easy to miss and looks like a labview bug.
#
#   3. Any client-supplied X-Forwarded-User is discarded. labview trusts this
#      header completely -- it is the only thing naming the lease holder and
#      the only thing in the audit trail -- so the proxy must overwrite it,
#      never pass it through.
#
# Identity is not an authorisation input: everyone who gets past this proxy
# can see every machine.

upstream labview {
    server 127.0.0.1:8080;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name labview.lab.example.com;

    ssl_certificate     /etc/pki/tls/certs/labview.crt;
    ssl_certificate_key /etc/pki/tls/private/labview.key;

    # However SSO is done here -- auth_request, OIDC, mTLS, basic auth --
    # it must end with a username in a variable. $remote_user is what basic
    # auth and many auth_request setups leave behind.
    auth_basic           "lab";
    auth_basic_user_file /etc/nginx/labview.htpasswd;

    location / {
        proxy_pass http://labview;

        # (1) labview's origin check compares Origin to Host.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # (2) and (3): set from the authenticated identity, overwriting
        # whatever the client sent. proxy_set_header replaces rather than
        # appends, which is what makes this safe -- but it must be set here,
        # in the same location that handles the upgrade, or websockets miss
        # it.
        proxy_set_header X-Forwarded-User  $remote_user;

        # Websockets: the console, the serial line and the logs tail.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # A wall tile is a long lived view-only session, and a developer
        # watching a boot may see nothing for minutes. Without this the
        # proxy closes consoles that are working perfectly well.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;

        # A framebuffer is latency sensitive and already compressed.
        proxy_buffering off;
        gzip off;
    }
}
