---
major_changes:
  - "deploy - ship the systemd unit, the polkit rule and the nginx
    configuration. labview runs as its own user, the polkit rule covers the
    units of the lab only, and the proxy holds the TLS, the SSO and the
    headers that labview depends on."
  - "container - publish the image to the registry of this repository. It is
    the binary on `scratch` and it runs as uid 65532
    (https://github.com/maglo/qemu-lab-manager/issues/14)."
known_issues:
  - "labview - the screenshot tile has no capture source. `-tile-mode` selects
    the renderer, and the renderer says what it waits for rather than
    inventing an endpoint."
  - "labview - one labview serves one hypervisor. There is no aggregation of
    several hypervisors yet."
  - "lease - a lease cannot be stolen. A lease that expires releases the
    keyboard, and there is no way to take it sooner."
  - "container - the logs tab and the disk sizes of the details tab do not
    work in the container, because the image holds no `journalctl` and no
    `qemu-img`. Both say what is missing."
