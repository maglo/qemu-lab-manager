---
major_changes:
  - "console - proxy the framebuffer of a machine to the browser over a
    websocket. labview reads enough RFB to tell input traffic from viewing
    traffic, so a viewer without the write lease watches and does not type."
  - "serial - hold one connection to the serial port of each machine and fan
    it out to every subscriber. A subscriber gets the scrollback first, so a
    harness can open a machine that is switched off, start it, and watch it
    boot from the first line."
  - "serial - separate what the machine printed from what labview says about
    itself. A binary frame is the output of the machine, and a text frame is
    labview. A status message mixed into the output would land in the
    recording and in anything that greps the stream."
  - "serial - capture the output to asciicast v2, one file for each run of a
    machine, and rotate on a reconnect. Retention is by count, by age and by
    total size, with a ceiling for one file."
  - "lease - give the keyboard to one person at a time. The proxy names the
    person in `X-Forwarded-User`, the lease expires, and the activity of a
    machine records who attached and who held control."
  - "host - read the unit, the command line, the disks, the network and the
    journal of a machine from the hypervisor, without libvirt and without an
    agent. `-host-access fake` invents the details so the wall can be worked
    on with no lab attached, and it is never a fallback."
  - "power - start, stop and restart a machine through its systemd unit. The
    `unit` field of the inventory is an allowlist: a machine with no unit has
    no power operations, and labview does not guess a unit name from an id."
