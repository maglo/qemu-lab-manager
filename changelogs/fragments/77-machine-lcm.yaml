---
breaking_changes:
  - "labview - the default ``-inventory`` directory is
    ``/var/lib/labview/inventory.d``, so the API can write machine
    files on a bootc node. Pass ``-inventory /etc/labview/inventory.d``
    to keep the old path
    (https://github.com/maglo/qemu-lab-manager/issues/77)."
major_changes:
  - "api - ``POST /api/machines`` creates a machine and
    ``DELETE /api/machines/{id}`` destroys an API-created one. Create
    writes a disk, a QEMU argv file and an inventory entry; destroy
    stops the unit and removes them
    (https://github.com/maglo/qemu-lab-manager/issues/77)."
minor_changes:
  - "labview - ``-machines-dir`` holds API-created machine state.
    Empty disables create and destroy
    (https://github.com/maglo/qemu-lab-manager/issues/77)."
  - "image - ship ``qemu-vm@.service`` for API-created machines
    (https://github.com/maglo/qemu-lab-manager/issues/77)."
