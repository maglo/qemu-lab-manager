---
trivial:
  - "docs - say what account labview runs as, and how polkit sees it. The polkit rule is mandatory: a system service has no logind session, so the action falls through to ``auth_admin``, no agent answers the prompt, and every power operation fails. Section 10 of the design document holds the chain from the D-Bus call to the polkit decision, and it says why labview must never run as root (https://github.com/maglo/qemu-lab-manager/issues/40)."
  - "deploy - ``labview.service`` and ``50-labview-units.rules`` say to create the service account and to install the rule with the unit (https://github.com/maglo/qemu-lab-manager/issues/40)."
